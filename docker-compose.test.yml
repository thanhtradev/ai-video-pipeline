# Local test infrastructure only. Versions match production (docs/infrastructure.md S-02, S-03).
# Never point tests at production hosts.
services:
  postgres:
    image: postgres:15.18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.0.15
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  webdav:
    image: bytemark/webdav:2.4
    environment:
      AUTH_TYPE: Basic
      USERNAME: archive
      PASSWORD: archive
    ports:
      - "127.0.0.1:58080:80"
