# nginx in front of the self-hosted telegram-bot-api server (--local mode).
# In --local mode getFile returns an absolute path on the server's disk and the server does not
# serve /file/... over HTTP, so n8n's Telegram "Get file" (download: true) gets a 404.
# This proxy serves those files from the data directory and passes everything else through.
# Runbook: ops/telegram-local-bot-api.md section 2.
#
# Live on LXC 107 as /etc/nginx/conf.d/tg-bot-api-files.conf (Debian nginx package). The Bot API
# server's working directory is /var/lib/telegram-bot-api; nginx and the server run as the same
# user (run-as-user.sh) because tdlib writes files with mode 0600.

server {
    listen 8082;
    client_max_body_size 2000m;

    # n8n requests /file/bot<token>//<absolute file_path>; nginx merges the double slash.
    # The token in the URL must equal the bot's data folder name, so a caller must know the token
    # to read that bot's files. nginx normalizes "..", so the path cannot leave the folder.
    location ~ ^/file/bot([0-9]+:[A-Za-z0-9_-]+)/+var/lib/telegram-bot-api/\1/(.+)$ {
        alias /var/lib/telegram-bot-api/$1/$2;
    }

    # Any other /file/ request (wrong token, path outside the data dir).
    location /file/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
